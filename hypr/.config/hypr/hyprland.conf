
################
### MONITORS ###
################

monitor = DP-1, 3440x1440@165, 0x0, 1
monitor = DP-2, 3440x1440@100, 0x-1440, 1


###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$fileManager = thunar
$menu = rofi -show drun
$runner = rofi -show run
$browser = vivaldi


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = hyprpaper
exec-once = systemctl --user start hyprpolkitagent
exec-once = udiskie


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 10
    gaps_out = 20

    border_size = 4

	col.active_border = rgba(ffb454cc) rgba(ff8f40cc) 45deg
	col.inactive_border = rgba(3f4a59aa)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.97
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 2
        new_optimizations = on
        ignore_opacity = false
        xray = false
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
    }
}


animations {
    enabled = true

    # Dynamic base curves
    bezier = wind,   0.05, 0.9, 0.1, 1.0
    bezier = winIn,  0.1,  1.0, 0.1, 1.0
    bezier = winOut, 0.3, -0.2, 0,   1
    bezier = liner,  1,    1,   1,   1

    # End-4 style curves for UI layers / menus
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3,  0,   0.8, 0.15
    bezier = menu_decel, 0.1, 1,   0,   1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07

    # Windows: keep Dynamic's slide identity, but tuned faster
    animation = windows,     1, 2.8, wind,   slide
    animation = windowsIn,   1, 2.7, winIn,  slide
    animation = windowsOut,  1, 2.4, winOut, slide
    animation = windowsMove, 1, 1.9, wind,   slide

    # Borders
    animation = border,      1, 1, liner
    animation = borderangle, 0

    # Global fades
    animation = fade,        1, 3.5, md3_decel

    # Curated layer behavior from End-4
    animation = layersIn,      1, 2.2, menu_decel, slide
    animation = layersOut,     1, 1.3, menu_accel
    animation = fadeLayersIn,  1, 1.6, menu_decel
    animation = fadeLayersOut, 1, 2.8, menu_accel

    # Workspaces
    animation = workspaces,       1, 3.0, wind, slide
    animation = specialWorkspace, 1, 2.4, md3_decel, slidevert
}


dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # Let hyprpaper handle wallpapers without the default flash
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

bindd = SUPER ALT, 6, Speech-to-text, exec, /usr/lib/hyprwhspr/config/hyprland/hyprwhspr-tray.sh record

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, R, exec, $runner
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle


# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

###############
### PLUGINS ###
###############

plugin:dynamic-cursors {

    # enables the plugin
    enabled = true

    # sets the cursor behaviour, supports these values:
    # tilt    - tilt the cursor based on x-velocity
    # rotate  - rotate the cursor based on movement direction
    # stretch - stretch the cursor shape based on direction and velocity
    # none    - do not change the cursors behaviour
    mode = tilt

    # minimum angle difference in degrees after which the shape is changed
    # smaller values are smoother, but more expensive for hw cursors
    threshold = 2

    # for mode = tilt
    tilt {

        limit = 5000

        function = negative_quadratic

        window = 100

        full_tilt = 60
    }


    shake {

        enabled = true

        nearest = false

        threshold = 4

        base = 2.0
        speed = 2.0
        influence = 0.5

        limit = 3.0

        timeout = 500

        effects = true

        ipc = false
    }
}
