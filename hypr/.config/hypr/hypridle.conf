general {
    lock_cmd = echo "no lock"
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = sh -c 'ddcutil --sleep-multiplier=0.1 --display 1 setvcp 10 0; sleep 0.2; ddcutil --sleep-multiplier=0.1 --display 2 setvcp 10 0'
    on-resume = sh -c 'ddcutil --sleep-multiplier=0.1 --display 1 setvcp 10 100; sleep 0.2; ddcutil --sleep-multiplier=0.1 --display 2 setvcp 10 100'
}